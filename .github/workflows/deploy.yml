name: deployment-portofolio-web

on:
  push:
    branches:
      - release

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: checkout-repository
        uses: actions/checkout@v4

      - name: set-image-tag
        id: image
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: build-image
        run: |
          echo "========================================"
          echo "Building Docker image"
          echo "Image: portofolio-web:${{ steps.image.outputs.tag }}"
          echo "========================================"

          docker build \
            -t portofolio-web:${{ steps.image.outputs.tag }} \
            .

          echo "========================================"
          echo "Build completed"
          echo "========================================"

      - name: save-image
        run: |
          docker save \
            portofolio-web:${{ steps.image.outputs.tag }} \
            -o portofolio-web.tar

      - name: upload-image
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "portofolio-web.tar"
          target: "/tmp"

      - name: deploy-to-k3s
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            set -e

            echo "Import image to K3s..."
            k3s ctr images import /tmp/portofolio-web.tar

            echo "Update deployment..."
            kubectl set image deployment/portofolio-web \
              portofolio-web=portofolio-web:${IMAGE_TAG}

            echo "Waiting for rollout..."
            kubectl rollout status deployment/portofolio-web \
              --timeout=180s

            echo "Deployment successful!"

            kubectl get pods -l app=portofolio-web

            rm -f /tmp/portofolio-web.tar